[package]
edition = "2021"
name = "pathfinder"
version = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
geojson = "0.24.1"
js-sys = "0.3"
pathfinding = "4.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.135"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
lto = true
strip = "symbols"

# wasm-opt is disabled: enabling it requires --enable-* feature flags matched
# to the local binaryen version, and Vercel's wasm-pack ships a different
# binaryen that rejected them, failing the deploy. Off is the proven-deployable
# state (lto + strip already shrink the binary). Revisit only with a binaryen
# version pinned across local and CI.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
